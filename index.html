<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick Draft</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;font-size:13px;color:#333;background:#f5f5f5;line-height:1.5}
.app{max-width:960px;margin:0 auto;padding:12px 16px}
header{padding:8px 0 6px;border-bottom:1px solid #ddd;margin-bottom:10px;display:flex;align-items:baseline;justify-content:space-between}
header h1{font-size:14px;font-weight:600;color:#444}
header .meta{font-size:11px;color:#999}
.seed{font-size:11px;color:#999;display:flex;align-items:center;gap:6px}
.seed code{background:#eee;padding:1px 5px;border-radius:2px;font-family:Consolas,monospace;color:#666;letter-spacing:.5px}
.seed button{font-size:10px;padding:2px 8px;border:1px solid #ccc;border-radius:2px;background:#fff;color:#888;cursor:pointer;font-family:inherit}
.seed button:hover{background:#f0f0f0;border-color:#bbb}
.progress{display:flex;gap:3px;margin-bottom:10px}
.progress-pip{flex:1;height:3px;background:#e0e0e0;border-radius:1px}
.progress-pip.done{background:#888}
.progress-pip.active{background:#555}
.step-info{font-size:11px;color:#999;margin-bottom:10px}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.panels{grid-template-columns:1fr}}
.panel{background:#fff;border:1px solid #ddd;border-radius:3px}
.panel-head{padding:6px 10px;background:#fafafa;border-bottom:1px solid #e8e8e8;display:flex;align-items:center;justify-content:space-between}
.panel-head h2{font-size:12px;font-weight:600;color:#555}
.panel-head .count{font-size:11px;color:#aaa}
.panel-body{padding:10px}
.prompt{font-size:11px;color:#888;margin-bottom:8px}
.prompt b{color:#555}
.choices{display:flex;flex-direction:column;gap:2px}
.choice{display:flex;align-items:center;gap:8px;padding:4px 8px;border:1px solid transparent;border-radius:2px;cursor:pointer;font-size:12px}
.choice:hover{background:#f0f4ff;border-color:#c8d4e8}
.choice.selected{background:#e8eef8;border-color:#a0b4d0}
.choice.dimmed{opacity:.3;pointer-events:none}
.choice .name{flex:1;color:#333}
.choice .type{font-size:10px;color:#aaa;white-space:nowrap}
.choice .copies{font-size:10px;color:#888;background:#f0f0f0;padding:1px 5px;border-radius:2px;white-space:nowrap}
.info-list{margin:4px 0}
.info-item{font-size:12px;color:#555;padding:2px 0}
.actions{margin-top:10px;display:flex;gap:8px;justify-content:flex-end}
.btn{font-size:12px;padding:5px 14px;border:1px solid #ccc;border-radius:3px;background:#fff;color:#555;cursor:pointer;font-family:inherit}
.btn:hover{background:#f0f0f0;border-color:#bbb}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn-primary{background:#5a7;color:#fff;border-color:#5a7}
.btn-primary:hover:not(:disabled){background:#4a6}
.results-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:2px}
@media(max-width:700px){.results-grid{grid-template-columns:1fr}}
.deck{background:#fff;border:1px solid #ddd;border-radius:3px}
.deck-head{padding:6px 10px;background:#fafafa;border-bottom:1px solid #e8e8e8;display:flex;align-items:center;justify-content:space-between}
.deck-head h2{font-size:12px;font-weight:600;color:#555}
.deck-head .count{font-size:11px;color:#aaa}
.deck-body{padding:8px 10px}
.deck-id{font-size:12px;font-weight:600;color:#444;padding-bottom:6px;margin-bottom:6px;border-bottom:1px solid #eee}
.deck-section{margin-bottom:8px}
.deck-section:last-child{margin-bottom:0}
.section-title{font-size:10px;font-weight:600;color:#999;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.deck-entry{font-size:12px;color:#444;padding:1px 0}
.deck-entry .qty{color:#999;display:inline-block;width:22px;text-align:right;margin-right:4px}
.export{margin-top:10px}
.tabs{display:flex;gap:1px;margin-bottom:-1px;position:relative;z-index:1}
.tab{font-size:11px;padding:4px 10px;background:#eee;border:1px solid #ddd;border-bottom:none;border-radius:3px 3px 0 0;cursor:pointer;color:#888}
.tab.active{background:#fff;color:#555;border-bottom-color:#fff}
.export textarea{width:100%;height:140px;background:#fff;border:1px solid #ddd;border-radius:0 3px 3px 3px;font-family:Consolas,monospace;font-size:11px;padding:8px;color:#444;resize:vertical}
.export textarea:focus{outline:none;border-color:#aac}
.loading{text-align:center;padding:60px 0;color:#999;font-size:12px}
.loading .dots::after{content:'';animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
.error{background:#fff;border:1px solid #ddd;border-radius:3px;padding:20px;max-width:400px;margin:40px auto;text-align:center}
.error h3{font-size:13px;color:#c55;margin-bottom:6px}
.error p{font-size:12px;color:#888}
.drafted{border-top:1px solid #e8e8e8}
.drafted-toggle{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;cursor:pointer;user-select:none;background:#fafafa}
.drafted-toggle:hover{background:#f0f0f0}
.drafted-toggle h3{font-size:11px;font-weight:600;color:#999;text-transform:uppercase;letter-spacing:.3px}
.drafted-toggle .arrow{font-size:9px;color:#bbb;transition:transform .15s}
.drafted-toggle.open .arrow{transform:rotate(90deg)}
.drafted-body{padding:6px 10px 8px;display:none}
.drafted-body.open{display:block}
.drafted-body .deck-section{margin-bottom:4px}
.drafted-body .deck-section:last-child{margin-bottom:0}
.drafted-body .section-title{font-size:9px;margin-bottom:1px}
.drafted-body .deck-entry{font-size:11px;padding:0;color:#666}
.drafted-empty{font-size:11px;color:#ccc;font-style:italic;padding:2px 0}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>

const CORP_BAN_LIST=new Set(["Ad Blitz","Aimor","Ancestral Imager","Anson Rose","Aryabhata Tech","Awakening Center","Back Channels","Backroom Machinations","Bad Times","Bamboo Dome","Big Brother","Bioroid Efficiency Research","Bioroid Work Crew","Blacklist","Bloom","Bloodletter","Bloop","Brain-Taping Warehouse","Broadcast Square","Builder","Bullfrog","Burke Bugs","Business As Usual","Cerebral Static","Cell Portal","Chairman Hiro","ChiLo City Grid","CFC Excavation Contract","Chronos Project","Clyde Van Rite","Cold Site Server","Commercialization","Constellation Protocol","Corporate War","Cyberdex Trial","Dedicated Response Team","Dedication Ceremony","Defective Brainchips","Director Haas","Drone Screen","Early Premiere","Encrypted Portals","Enforced Curfew","Executive Retreat","Fast Break","Firmware Updates","Foxfire","Freelancer","Fumiko Yamamori","Fractal Threat Matrix","Freedom of Information","Gemini","Henry Phillips","Hasty Relocation","Helium-3 Deposit","Hellion Alpha Test","Hollywood Renovation","Howler","Hudson 1.0","Hyoubu Research Facility","Illicit Sales","Improved Protein Source","Improved Tracers","Increased Drop Rates","Ireress","Investigator Inez Delgado A","Lakshmi Smartfabrics","Lt. Todachine 2","Lockdown","Macrophage","Mark Yale","MCA Informant","Medical Breakthrough","Megaprix Qualifier","Merlin","Metamorph","Merger","Midnight-3 Arcology","Midori","Minelayer","Mumbad Construction Co.","Net Analytics","Net Police","Net Quarantine","Net Watchlist","New Construction","NEXT Wave 2","Observe and Destroy","Otoroshi","PAD Factory","Paper Trail","Pachinko","Personality Profiles","Primary Transmission Dish","Priority Construction","Product Recall","Project Ares","Project Wotan","Psychographics","Puppet Master","Ravana 1.0","Rebranding Team","Reconstruction Contract","Regulatory Capture","Remote Data Farm","Research Grant","Restoring Face","Rutherford Grid","Sacrifice","Salvage","Salem's Hospitality","Satellite Grid","Sealed Vault","Searchlight","Self-Destru // Seeded PRNG (mulberry32)
function mulberry32(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashSeed(str){let h=0;for(let i=0;i<str.length;i++){h=Math.imul(31,h)+str.charCodeAt(i)|0}return h}
function generateSeed(){const c='abcdefghijklmnopqrstuvwxyz0123456789';let s='';for(let i=0;i<8;i++)s+=c[Math.floor(Math.random()*c.length)];return s}

function shuffle(a,rng){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function take(a,n){return a.slice(0,n)}
function uniqTitle(cards,n){const s=new Set,r=[];for(const c of cards){if(!s.has(c.title)&&r.length<n){s.add(c.title);r.push(c)}}return r}
function isBanned(c,bl){if(bl.has(c.title))return true;for(const b of bl)if(c.title.startsWith(b))return true;return false}
function hasSub(c,s){return c.keywords?c.keywords.toLowerCase().includes(s.toLowerCase()):false}
function tLabel(c){const t=c.type_code;if(t==='agenda')return c.agenda_points+'pt agenda';if(t==='ice')return'ice'+(c.keywords?' — '+c.keywords:'');if(t==='program')return'program'+(c.keywords?' — '+c.keywords:'');return t||''}

async function fetchCards(){const r=await fetch('https://netrunnerdb.com/api/2.0/public/cards');if(!r.ok)throw new Error('HTTP '+r.status);return(await r.json()).data}

function buildPools(all){
  const seen=new Set,uniq=[];
  for(const c of all.filter(c=>c.pack_code!=='tdc'&&c.pack_code!=='draft'))if(!seen.has(c.title)){seen.add(c.title);uniq.push(c)}
  const byTitle=(a,b)=>a.title.localeCompare(b.title);
  const corp=uniq.filter(c=>c.side_code==='corp').sort(byTitle),runner=uniq.filter(c=>c.side_code==='runner').sort(byTitle);
  const cPool=corp.filter(c=>c.type_code!=='identity'&&c.type_code!=='agenda'&&!isBanned(c,CORP_BAN_LIST));
  const rPool=runner.filter(c=>c.type_code!=='identity'&&!isBanned(c,RUNNER_BAN_LIST));
  const rNP=rPool.filter(c=>!hasSub(c,'fracter')&&!hasSub(c,'decoder')&&!hasSub(c,'killer'));
  return{cPool,cIce:cPool.filter(c=>c.type_code==='ice'),rPool,rNP,fr:rPool.filter(c=>hasSub(c,'fracter')),de:rPool.filter(c=>hasSub(c,'decoder')),ki:rPool.filter(c=>hasSub(c,'killer'))}
}

function pk(pool,show,copies,tag,rng){return{choices:uniqTitle(shuffle(pool,rng),show).map(c=>c.title),copies,tag}}
function pkT(titles,show,copies,tag,rng){return{choices:take(shuffle(titles,rng),show),copies,tag}}

function genDraft(p,seed){
  const rng=mulberry32(hashSeed(seed));
  const q=[];
  q.push({corp:{type:'info',prompt:'Auto-included in Corp deck:',auto:[{t:'Hedge Fund',n:3},{t:'Jackson Howard',n:2}]},runner:{type:'info',prompt:'Auto-included in Runner deck:',auto:[{t:'Blueberry!™ Diesel',n:3},{t:'Sure Gamble',n:2},{t:'Crypsis',n:1}]}});
  const cs=[pkT(VALID_3PT_AGENDAS,5,2,'3pt Agenda',rng),pkT(VALID_2PT_AGENDAS,5,4,'2pt Agenda',rng),pk(p.cIce,12,3,'Ice',rng),pk(p.cPool,9,3,'Card',rng),pk(p.cPool,9,3,'Card',rng),pk(p.cPool,9,3,'Card',rng),pk(p.cPool,9,3,'Card',rng)];
  const rs=[pk(p.rNP,9,3,'Non-breaker',rng),pk(p.rPool,10,3,'Any',rng),pk(p.rNP,9,3,'Non-breaker',rng),pk(p.rPool,10,3,'Any',rng),
    {choices:[...uniqTitle(shuffle(p.fr,rng),4).map(c=>c.title),...uniqTitle(shuffle(p.rNP,rng),3).map(c=>c.title)],copies:2,tag:'Fracter pick'},
    {choices:[...uniqTitle(shuffle(p.de,rng),4).map(c=>c.title),...uniqTitle(shuffle(p.rNP,rng),3).map(c=>c.title)],copies:2,tag:'Decoder pick'},
    {choices:[...uniqTitle(shuffle(p.ki,rng),4).map(c=>c.title),...uniqTitle(shuffle(p.rNP,rng),3).map(c=>c.title)],copies:2,tag:'Killer pick'}];
  for(let i=0;i<7;i++)q.push({corp:{type:'pick',...cs[i]},runner:{type:'pick',...rs[i]}});
  q.push({corp:{type:'id',choices:take(shuffle(VALID_CORP_IDS,rng),4),tag:'Identity'},runner:{type:'id',choices:take(shuffle(VALID_RUNNER_IDS,rng),4),tag:'Identity'}});
  const cs2=[pk(p.cPool,12,2,'Card',rng),pk(p.cPool,12,2,'Card',rng),pk(p.cPool,12,2,'Card',rng),pk(p.cPool,12,2,'Card',rng)];
  const rs2=[pk(p.rNP,12,2,'Non-breaker',rng),pk(p.rPool,12,2,'Any',rng),pk(p.rNP,12,2,'Non-breaker',rng),pk(p.rPool,12,2,'Any',rng)];
  for(let i=0;i<4;i++)q.push({corp:{type:'pick',...cs2[i]},runner:{type:'pick',...rs2[i]}});
  return q;
}

let cardDb=null,S=null;
function fresh(q,seed){return{queue:q,step:0,cD:new Map,rD:new Map,cId:null,rId:null,cP:null,rP:null,seed:seed,picks:[]}}
function add(d,t,n){d.set(t,(d.get(t)||0)+n)}
function sz(d){let t=0;for(const v of d.values())t+=v;return t}
function phase(s){if(s===0)return'Starters';if(s<=7)return'Stage 1 — pick '+s+'/7';if(s===8)return'Identity';return'Stage 2 — pick '+(s-8)+'/4'}

const app=document.getElementById('app');
function render(){if(!S)return rLoading();if(S.step>=S.queue.length)return rResults();rDraft()}
function rLoading(){app.innerHTML='<header><h1>Quick Draft</h1></header><div class="loading">Loading card data<span class="dots"></span></div>'}
function rError(m){app.innerHTML='<header><h1>Quick Draft</h1></header><div class="error"><h3>Error</h3><p>'+m+'</p><br><button class="btn" onclick="init()">Retry</button></div>'}

function rDraft(){
  const st=S.queue[S.step],ok=(st.corp.type==='info'||S.cP!==null)&&(st.runner.type==='info'||S.rP!==null);
  const pips=Array.from({length:S.queue.length},(_,i)=>'<div class="progress-pip '+(i<S.step?'done':i===S.step?'active':'')+'"></div>').join('');
  app.innerHTML=`<header><h1>Quick Draft</h1><div class="seed">Seed: <code>${S.seed}</code><button onclick="copyLink()">Copy link</button></div><span class="meta">Step ${S.step+1}/${S.queue.length}</span></header>
<div class="progress">${pips}</div><div class="step-info">${phase(S.step)}</div>
<div class="panels"><div class="panel"><div class="panel-head"><h2>Corp</h2><span class="count">${sz(S.cD)} cards${S.cId?' · '+S.cId.split(':')[0]:''}</span></div>
<div class="panel-body">${panelH(st.corp,'corp')}</div>${draftedH(S.cD,S.cId,'corp')}</div>
<div class="panel"><div class="panel-head"><h2>Runner</h2><span class="count">${sz(S.rD)} cards${S.rId?' · '+S.rId.split(':')[0]:''}</span></div>
<div class="panel-body">${panelH(st.runner,'runner')}</div>${draftedH(S.rD,S.rId,'runner')}</div></div>
<div class="actions">${st.corp.type==='info'?'<button class="btn btn-primary" onclick="confirmStep()">Continue</button>':'<button class="btn btn-primary" onclick="confirmStep()" '+(ok?'':'disabled')+'>Confirm</button>'}</div>`}

function panelH(p,side){
  if(p.type==='info')return'<div class="prompt">'+p.prompt+'</div><div class="info-list">'+p.auto.map(c=>'<div class="info-item">'+c.n+'× '+c.t+'</div>').join('')+'</div>';
  const sel=side==='corp'?S.cP:S.rP;
  const label=p.type==='id'?'Choose identity':'Pick 1 — receive '+p.copies+' copies';
  return'<div class="prompt">'+label+' <b>['+p.tag+']</b></div><div class="choices">'+p.choices.map((t,i)=>{
    const isSel=sel===i,dim=sel!==null&&!isSel,card=cardDb?.get(t),tl=card?tLabel(card):'';
    return'<div class="choice'+(isSel?' selected':'')+(dim?' dimmed':'')+'" onclick="pk2(\''+side+'\','+i+')"><span class="name">'+t+'</span>'+(tl?'<span class="type">'+tl+'</span>':'')+'<span class="copies">×'+(p.type==='id'?1:p.copies)+'</span></div>'
  }).join('')+'</div>'}

const _draftOpen={corp:true,runner:true};
function draftedH(deck,id,side){
  const n=sz(deck);
  const open=_draftOpen[side];
  const body=n===0?'<div class="drafted-empty">No cards drafted yet</div>':(id?'<div class="deck-id" style="font-size:11px;padding-bottom:4px;margin-bottom:4px">'+id+'</div>':'')+deckH(deck);
  return'<div class="drafted"><div class="drafted-toggle'+(open?' open':'')+'" onclick="toggleDrafted(\''+side+'\')"><h3>Drafted · '+n+' cards</h3><span class="arrow">▶</span></div><div class="drafted-body'+(open?' open':'')+'">'+body+'</div></div>'}
window.toggleDrafted=function(side){_draftOpen[side]=!_draftOpen[side];render()};

function rResults(){
  app.innerHTML=`<header><h1>Quick Draft</h1><div class="seed">Seed: <code>${S.seed}</code><button onclick="copyLink()">Copy link</button></div><span class="meta">Complete</span></header>
<div class="results-grid"><div class="deck"><div class="deck-head"><h2>Corp</h2><span class="count">${sz(S.cD)} cards · win at 5 pts</span></div>
<div class="deck-body"><div class="deck-id">${S.cId||'—'}</div>${deckH(S.cD)}</div></div>
<div class="deck"><div class="deck-head"><h2>Runner</h2><span class="count">${sz(S.rD)} cards · win at 6 pts</span></div>
<div class="deck-body"><div class="deck-id">${S.rId||'—'}</div>${deckH(S.rD)}</div></div></div>
<div class="export"><div class="tabs"><div class="tab active" onclick="swTab('corp',this)">Corp</div><div class="tab" onclick="swTab('runner',this)">Runner</div></div>
<textarea id="exp" readonly onclick="this.select()">${expTxt('corp')}</textarea></div>
<div class="actions"><button class="btn" onclick="cpExp()">Copy</button><button class="btn btn-primary" onclick="startNew()">New Draft</button></div>`}

function deckH(deck){
  const g={},names={agenda:'Agendas',ice:'Ice',asset:'Assets',upgrade:'Upgrades',operation:'Operations',event:'Events',hardware:'Hardware',resource:'Resources',program:'Programs'},
    order=['Agendas','Ice','Assets','Upgrades','Operations','Events','Hardware','Resources','Programs','Other'];
  for(const[t,q]of deck){const c=cardDb?.get(t);const n=names[c?.type_code]||'Other';(g[n]=g[n]||[]).push({title:t,qty:q})}
  let h='';for(const o of order){if(!g[o])continue;g[o].sort((a,b)=>a.title.localeCompare(b.title));
    h+='<div class="deck-section"><div class="section-title">'+o+'</div>'+g[o].map(e=>'<div class="deck-entry"><span class="qty">'+e.qty+'×</span>'+e.title+'</div>').join('')+'</div>'}return h}

function expTxt(side){const d=side==='corp'?S.cD:S.rD,id=side==='corp'?S.cId:S.rId;let t=(id||'Unknown')+'\n';for(const[title,qty]of d)t+=qty+' '+title+'\n';return t.trim()}

window.pk2=function(side,i){if(side==='corp')S.cP=S.cP===i?null:i;else S.rP=S.rP===i?null:i;render()};
function applyStep(cIdx,rIdx){
  const st=S.queue[S.step];
  if(st.corp.type==='info')st.corp.auto.forEach(c=>add(S.cD,c.t,c.n));
  else if(st.corp.type==='pick')add(S.cD,st.corp.choices[cIdx],st.corp.copies);
  else if(st.corp.type==='id')S.cId=st.corp.choices[cIdx];
  if(st.runner.type==='info')st.runner.auto.forEach(c=>add(S.rD,c.t,c.n));
  else if(st.runner.type==='pick')add(S.rD,st.runner.choices[rIdx],st.runner.copies);
  else if(st.runner.type==='id')S.rId=st.runner.choices[rIdx];
  if(st.corp.type!=='info')S.picks.push({c:cIdx,r:rIdx});
  S.cP=null;S.rP=null;S.step++}
function updateHash(){const p=S.picks.map(pk=>pk.c.toString(16)+pk.r.toString(16)).join('');history.replaceState(null,'','#'+S.seed+(p?'-'+p:''))}
window.confirmStep=function(){applyStep(S.cP,S.rP);updateHash();render();window.scrollTo({top:0,behavior:'smooth'})};
window.startNew=function(){const seed=generateSeed();S=fresh(genDraft(buildPools([...cardDb.values()]),seed),seed);updateHash();render();window.scrollTo({top:0})};
window.swTab=function(side,el){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');document.getElementById('exp').value=expTxt(side)};
window.cpExp=function(){const ta=document.getElementById('exp');ta.select();navigator.clipboard.writeText(ta.value).catch(()=>document.execCommand('copy'))};
window.copyLink=function(){navigator.clipboard.writeText(location.href).then(()=>{const b=document.querySelector('.seed button');b.textContent='Copied!';setTimeout(()=>{b.textContent='Copy link'},1500)}).catch(()=>{})};

async function init(){render();try{const all=await fetchCards();cardDb=new Map;for(const c of all)if(!cardDb.has(c.title))cardDb.set(c.title,c);const h=location.hash.slice(1);const parts=h.split('-');const seed=parts[0]||generateSeed();const picksStr=parts[1]||'';const pools=buildPools(all);S=fresh(genDraft(pools,seed),seed);if(picksStr.length>=2){try{applyStep(null,null);for(let i=0;i+1<picksStr.length;i+=2){applyStep(parseInt(picksStr[i],16),parseInt(picksStr[i+1],16))}}catch(e){S=fresh(genDraft(pools,seed),seed)}}updateHash();render()}catch(e){console.error(e);rError('Could not load cards from NetrunnerDB. Check your connection.')}}
init();
</script>
</body>
</html>
